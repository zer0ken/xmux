[package]
name = "xmux"
version = "0.9.4"
edition = "2021"
description = "Cross-environment terminal multiplexer session switcher"
license = "MIT"
repository = "https://github.com/zer0ken/xmux"
readme = "README.md"
keywords = ["tmux", "psmux", "ssh", "tui", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "xmux"
path = "src/main.rs"

[lib]
name = "xmux"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Unwind (the default), NOT abort: the TUI relies on RAII Drop (TerminalGuard,
# ControlHandle) running during a panic to restore the terminal and remove the
# control socket. `panic = "abort"` would skip those and leave a wrecked terminal.
strip = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0.0"
futures = "0.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "fs"] }
toml = "1.1.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.16"
portable-pty = "0.9"
unicode-width = "0.2"
sha2 = "0.10"

[dev-dependencies]
# `test-util` gives the paused clock the poll-budget tests use: they let a 6s timeout
# elapse instantly instead of sleeping the suite.
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
# `getnameinfo`: the system resolver's own entry point. A mesh VPN configures the
# resolver with the zones naming its peers, so asking the OS is what makes a peer come
# back under the name its network gave it - with no vendor CLI, and on every unix
# including Android, whose libc has no `getent` to shell out to.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `Wdk_System_Threading` is where `NtQueryInformationProcess` lives (not
# `Win32_System_Threading`, which holds only the structures it fills in). Together with
# `Win32_System_Kernel` (the PEB declaration) and `Win32_System_Diagnostics_Debug`
# (`ReadProcessMemory`) it is what lets xmux read a live attach child's environment.
# `Win32_NetworkManagement_IpHelper` is the routing and neighbour tables (with
# `Win32_Networking_WinSock` for the address unions their rows carry and
# `Win32_NetworkManagement_Ndis` for the interface identifier inside a neighbour row),
# which is what makes the neighbour provider a call rather than a PowerShell start.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Wdk_System_Threading", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_Diagnostics_Debug", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
