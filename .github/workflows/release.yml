name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: .tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: .tar.gz
          # Termux runs on Android's bionic libc, which the glibc Linux builds
          # cannot load, so Android gets a build linked by the NDK the runner ships.
          - os: ubuntu-24.04
            target: aarch64-linux-android
            ext: .tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: .tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: .tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # API 24 is the oldest Android release Termux supports.
      - name: Link with the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          test -d "$ANDROID_NDK_HOME" || { echo "::error::the runner has no Android NDK" >&2; exit 1; }
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            cp "target/${{ matrix.target }}/release/xmux.exe" \
              "dist/xmux-v${VERSION}-${{ matrix.target }}.exe"
          else
            tar -C "target/${{ matrix.target }}/release" \
              -czf "dist/xmux-v${VERSION}-${{ matrix.target }}.tar.gz" xmux
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The install scripts ship as release assets, so `install.sh` served from a
      # release is the script that shipped with it. `xmux update` fetches them from
      # `releases/latest/download`, which a branch edit cannot change under a user.
      - name: Stage installer scripts
        run: |
          cp scripts/install/install.sh artifacts/install.sh
          cp scripts/install/install.ps1 artifacts/install.ps1
          cp scripts/install/install.cmd artifacts/install.cmd
      - name: Write checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # `secrets` is not available in `if` conditions (see the official
          # context-availability table), so the token is injected via `env` and
          # checked here, in the shell, where the secrets context is allowed.
          #
          # A missing token must FAIL the job, not silently skip: a silent skip
          # looked like a green release while crates.io was never updated.
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured on the crates-io environment; cannot publish to crates.io" >&2
            exit 1
          fi
          cargo publish

  # Refresh the winget and Homebrew packaging manifests with the new version
  # and the real checksums, commit them to main, and (when a token is
  # configured) open the winget-pkgs submission PR.
  update-packaging:
    name: Update packaging manifests
    needs: [build, release]
    runs-on: ubuntu-latest
    # The distribution channels below publish from exactly the commit this job
    # pushed, not whatever main is by the time they run.
    outputs:
      version: ${{ steps.checksums.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and checksums
        id: checksums
        run: |
          set -euo pipefail
          # Assigned before echoing: `set -e` does not abort on a failing
          # command substitution inside an argument, and a missing artifact
          # must fail this step instead of rendering an empty sha256.
          VERSION=${GITHUB_REF_NAME#v}
          WIN_SHA=$(sha256sum artifacts/*windows-msvc.exe | cut -d' ' -f1)
          ARM_SHA=$(sha256sum artifacts/*aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum artifacts/*x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          LINUX_ARM_SHA=$(sha256sum artifacts/*aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          LINUX_INTEL_SHA=$(sha256sum artifacts/*x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "WIN_SHA=$WIN_SHA" >> "$GITHUB_ENV"
          echo "ARM_SHA=$ARM_SHA" >> "$GITHUB_ENV"
          echo "INTEL_SHA=$INTEL_SHA" >> "$GITHUB_ENV"
          echo "LINUX_ARM_SHA=$LINUX_ARM_SHA" >> "$GITHUB_ENV"
          echo "LINUX_INTEL_SHA=$LINUX_INTEL_SHA" >> "$GITHUB_ENV"

      - name: Update winget manifest
        run: |
          set -euo pipefail
          sed -i "s/^PackageVersion: .*/PackageVersion: $VERSION/" \
            packaging/winget/zer0ken.xmux.yaml \
            packaging/winget/zer0ken.xmux.locale.en-US.yaml
          cat > packaging/winget/zer0ken.xmux.installer.yaml <<EOF
          PackageIdentifier: zer0ken.xmux
          PackageVersion: $VERSION
          InstallerType: portable
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/zer0ken/xmux/releases/download/v${VERSION}/xmux-v${VERSION}-x86_64-pc-windows-msvc.exe
              InstallerSha256: $WIN_SHA
              Commands:
                - xmux
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          cat > packaging/homebrew/xmux.rb <<EOF
          class Xmux < Formula
            desc "Cross-environment tmux/psmux session switcher"
            homepage "https://github.com/zer0ken/xmux"
            license "MIT"
            version "$VERSION"

            on_macos do
              on_arm do
                url "https://github.com/zer0ken/xmux/releases/download/v${VERSION}/xmux-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "$ARM_SHA"
              end

              on_intel do
                url "https://github.com/zer0ken/xmux/releases/download/v${VERSION}/xmux-v${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "$INTEL_SHA"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/zer0ken/xmux/releases/download/v${VERSION}/xmux-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$LINUX_ARM_SHA"
              end

              on_intel do
                url "https://github.com/zer0ken/xmux/releases/download/v${VERSION}/xmux-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$LINUX_INTEL_SHA"
              end
            end

            def install
              bin.install "xmux"
            end

            test do
              system "#{bin}/xmux", "version"
            end
          end
          EOF

      - name: Commit and push to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          if git diff --cached --quiet; then
            echo "No packaging changes for v$VERSION."
          else
            git commit -m "packaging: refresh manifests for v$VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The two distribution channels depend on the committed manifests and on
  # nothing of each other, so each is its own job: one refusing (a token without
  # the right scope) fails that job, visibly, and never skips the other. A failed
  # channel re-runs alone with `gh run rerun --failed`.

  # Optional: submit the refreshed manifests to the community winget-pkgs
  # repository. Requires a WINGET_PKGS_TOKEN secret: a classic PAT with
  # `public_repo`. A fine-grained token can write the zer0ken/winget-pkgs fork
  # but is refused opening the PR on microsoft/winget-pkgs, which it cannot be
  # granted.
  submit-winget:
    name: Submit to winget-pkgs
    needs: update-packaging
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.update-packaging.outputs.version }}
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-packaging.outputs.sha }}
      - name: Submit to winget-pkgs
        if: env.WINGET_PKGS_TOKEN != ''
        env:
          MANIFEST_DIR: packaging/winget
        run: bash .github/scripts/winget-submit.sh

  # Optional: sync the refreshed formula into the homebrew-xmux tap repo. The
  # GitHub token is scoped to this repo, so pushing to the separate tap repo
  # needs a dedicated HOMEBREW_TAP_TOKEN secret (a PAT able to write to
  # zer0ken/homebrew-xmux).
  sync-homebrew:
    name: Sync Homebrew tap
    needs: update-packaging
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.update-packaging.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-packaging.outputs.sha }}
      - name: Sync Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          TAP=zer0ken/homebrew-xmux
          git clone "https://github.com/${TAP}.git" tap
          cp packaging/homebrew/xmux.rb tap/Formula/xmux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/xmux.rb
          if git diff --cached --quiet; then
            echo "No Homebrew tap changes for v$VERSION."
          else
            git commit -m "formula: refresh for v$VERSION"
            git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP}.git" HEAD:main
          fi
